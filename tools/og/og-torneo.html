<!DOCTYPE html>
<!-- Fuente de img/og-torneo.jpg (1200×630), la imagen que sale al compartir el enlace.
     No se despliega. Para regenerarla: bash tools/og/hacer-og.sh
     Ilustración propia (img/atardecer.svg); nada de Rockstar ni Take-Two. -->
<html lang="es"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Libre+Baskerville:ital,wght@0,700;1,700&family=Inter:wght@500;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#120a30}
.og{position:relative;width:1200px;height:630px;font-family:'Inter',sans-serif;color:#fff;overflow:hidden}
.og img.arte{position:absolute;inset:0;width:1200px;height:630px}
.og::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,5,32,.96) 0%,rgba(14,5,32,.9) 38%,rgba(14,5,32,.45) 58%,rgba(14,5,32,0) 74%)}
.og::after{content:'';position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;background:linear-gradient(0deg,rgba(10,3,24,.85),rgba(10,3,24,0))}
.txt{position:absolute;z-index:2;left:68px;top:42px;width:640px}
.marca{font-family:'Libre Baskerville',serif;font-weight:700;font-size:40px;letter-spacing:-.02em}
.marca em{font-style:italic;color:#e0b94f}
.eyebrow{display:inline-block;margin-top:22px;font-weight:600;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#2de2e6;border:2px solid rgba(45,226,230,.55);border-radius:40px;padding:7px 20px;text-shadow:0 0 14px rgba(45,226,230,.55)}
h1{font-family:'Titan One','Arial Black',sans-serif;font-weight:400;text-transform:uppercase;line-height:1.02;margin-top:18px}
h1 .a{display:block;font-size:56px;letter-spacing:.01em;text-shadow:0 4px 0 #1a0b2e}
h1 .b{display:block;font-size:190px;margin-top:6px;letter-spacing:.01em;background:linear-gradient(180deg,#fff 10%,#ffd1e3 45%,#ff9a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #7a1f4a)}
.sub{margin-top:14px;font-size:29px;font-weight:600;line-height:1.3;color:rgba(255,255,255,.92)}
.sub b{color:#ffb347;font-weight:800}
.cta{display:inline-block;margin-top:22px;background:linear-gradient(90deg,#ff3d81,#ff9a3c);color:#1a0626;font-weight:800;font-size:27px;padding:12px 30px;border-radius:50px;box-shadow:0 8px 30px rgba(255,61,129,.45)}
.legal{position:absolute;z-index:2;right:40px;bottom:22px;font-size:16px;font-weight:500;color:rgba(255,255,255,.6)}
</style></head>
<body>
<div class="og">
  <img class="arte" src="../../img/atardecer.svg" alt="">
  <div class="txt">
    <div class="marca">Geo<em>Quiz</em></div>
    <div class="eyebrow">Torneo semanal</div>
    <h1><span class="b">GTA VI</span></h1>
    <div class="sub"><b>15 preguntas. Una sola oportunidad.</b><br>¿Estás a la altura de GTA VI?</div>
    <div class="cta">▶ Juega gratis</div>
  </div>
  <div class="legal">Torneo no oficial · sin relación con Rockstar Games</div>
</div>
</body></html>
